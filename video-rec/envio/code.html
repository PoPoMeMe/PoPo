<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>PoPo.meme × Envio — indexer source</title>
<style>
  :root{--bg:#070b14;--panel:#0d1524;--line:#1c2940;--cyan:#38dbea;--txt:#e9f0f8;--mut:#93a3bb;--green:#4ade80;--violet:#a78bfa;--amber:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .app{width:1440px;height:900px;padding:32px 40px;display:flex;flex-direction:column;gap:18px;
    background:radial-gradient(900px 420px at 85% -10%,rgba(167,139,250,.10),transparent 60%),var(--bg);}
  .kick{color:var(--cyan);font-weight:800;letter-spacing:.18em;font-size:14px;text-transform:uppercase}
  h1{font-size:32px;letter-spacing:-.4px;margin-top:4px}
  .sub{color:var(--mut);font-size:15px;margin-top:4px}
  .tabs{display:flex;gap:10px}
  .tab{background:#0b1322;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:11px 18px;
    font-family:"SF Mono",Menlo,monospace;font-size:14px;cursor:pointer}
  .tab.on{background:rgba(56,219,234,.12);border-color:var(--cyan);color:var(--cyan)}
  .codewrap{flex:1;background:#080d18;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .bar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:#0b1322}
  .dot{width:11px;height:11px;border-radius:50%}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .fname{margin-left:14px;font-family:"SF Mono",Menlo,monospace;font-size:13.5px;color:var(--mut)}
  .fname b{color:var(--txt)}
  pre{flex:1;overflow:hidden;margin:0;padding:22px 26px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17.5px;line-height:1.5;
    color:#d7e3f2;white-space:pre}
  .cm{color:#5f7290}.key{color:#7dd3fc}.str{color:#9ae6b4}.num{color:#fbbf24}.ty{color:#c4b5fd}.fn{color:#7dd3fc}
  .note{position:fixed;right:40px;bottom:26px;background:#0b1322;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--mut)}
  .note b{color:var(--cyan)}
</style>
</head>
<body>
<div class="app">
  <div>
    <div class="kick">PoPo.meme × Envio HyperIndex</div>
    <h1>Declarative config, typed schema, TypeScript event handlers</h1>
    <div class="sub">Real indexer source · <span style="color:var(--txt)">hackathon/envio-indexer</span> · Monad testnet</div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="0">config.yaml</button>
    <button class="tab" data-t="1">schema.graphql</button>
    <button class="tab" data-t="2">EventHandlers/PredictionMarket.ts</button>
  </div>
  <div class="codewrap">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="fname" id="fname"></span></div>
    <pre id="code"></pre>
  </div>
  <div class="note">Two facets on <b>one EIP-2535 Diamond</b> · same-named Buy/Sell events split to avoid overload ambiguity</div>
</div>
<script>
const SNIPPETS=[
 {f:"config.yaml", html:`<span class="cm"># PoPo.meme HyperIndex — Monad testnet (chainId 10143)</span>
name: popomonad
storage:
  postgres:
    column_name_format: snake_case
field_selection:
  transaction_fields: [<span class="str">"hash"</span>]
contracts:
  - name: Hatch
    handler: src/EventHandlers/Hatch.ts
    <span class="key">addresses</span>: [<span class="str">"0xa08e66FD…B0E4c07"</span>]   <span class="cm"># EIP-2535 Diamond</span>
    events:
      - event: TokenCreated(uint256 indexed tokenId, address indexed creator, …)
      - event: Buy(address trader, uint256 indexed tokenId, uint256 amount, …)
      - event: Sell(address trader, uint256 indexed tokenId, uint256 amount, …)
  - name: PredictionMarket
    handler: src/EventHandlers/PredictionMarket.ts
    <span class="key">addresses</span>: [<span class="str">"0xa08e66FD…B0E4c07"</span>]   <span class="cm"># same Diamond</span>
    events:
      - event: Buy(address trader, bytes32 indexed digest, bool yes, uint256 shares, …)
      - event: Sell(address trader, bytes32 indexed digest, bool yes, uint256 shares, …)`},
 {f:"schema.graphql", html:`<span class="ty">type</span> <span class="ty">Trader</span> {
  id: ID!
  address: String!
  hatchTrades: Int!
  predictionTrades: Int!
}

<span class="ty">type</span> <span class="ty">Memecoin</span> {
  id: ID!
  tokenId: BigInt! <span class="cm">@index</span>
  holders: Int!
  buyVolumeP: BigInt!
  sellVolumeP: BigInt!
  tradeCount: Int!
}

<span class="ty">type</span> <span class="ty">PredictionTrade</span> {
  id: ID!
  trader: Trader! <span class="cm">@index</span>
  market: PredictionMarket! <span class="cm">@index</span>
  side: String!          <span class="cm"># buy | sell</span>
  outcome: String!       <span class="cm"># yes | no</span>
  shares: BigInt!
  quoteP: BigInt!
  blockNumber: Int!
  transactionHash: String!
}`},
 {f:"src/EventHandlers/PredictionMarket.ts", html:`<span class="ty">import</span> { indexer, <span class="ty">type</span> EvmOnEventContext,
  <span class="ty">type</span> PredictionTrade } <span class="ty">from</span> <span class="str">"envio"</span>;

indexer.on(<span class="str">"PredictionMarket.Buy"</span>, <span class="ty">async</span> (ctx: EvmOnEventContext) => {
  <span class="ty">const</span> { event, transaction, block } = ctx;
  <span class="ty">const</span> trader = <span class="ty">await</span> ensureTrader(ctx, event.params.trader, block.number);

  <span class="ty">const</span> trade: PredictionTrade = {
    id: transaction.hash + <span class="str">":"</span> + event.logIndex,
    trader: trader.id,
    side: <span class="str">"buy"</span>,
    outcome: event.params.yes ? <span class="str">"yes"</span> : <span class="str">"no"</span>,
    shares: event.params.shares,
    quoteP: event.params.quoteP,       <span class="cm">// raw 18-decimal BigInt</span>
    blockNumber: block.number,
    transactionHash: transaction.hash,
  };
  ctx.PredictionTrade.set(trade);   <span class="cm">// → instant GraphQL row</span>
});`}
];
const code=document.getElementById("code"),fname=document.getElementById("fname");
function show(i){
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("on",j===i));
  code.innerHTML=SNIPPETS[i].html;
  fname.innerHTML=`<b>hackathon/envio-indexer/</b>${SNIPPETS[i].f}`;
}
document.querySelectorAll(".tab").forEach((t)=>t.onclick=()=>show(+t.dataset.t));
show(0);
</script>
</body></html>
